[preferred]
# xdg-desktop-portal reads this file because the session sets
# XDG_CURRENT_DESKTOP=umbralia:wlroots. It must be named
# umbralia-portals.conf; umbriel-portals.conf is not consulted for that name.
#
# xdg-desktop-portal-umbriel provides all portal backends for umbriel.
org.freedesktop.impl.portal.Screenshot=umbriel
org.freedesktop.impl.portal.ScreenCast=umbriel
org.freedesktop.impl.portal.FileChooser=umbriel
org.freedesktop.impl.portal.AppChooser=umbriel
org.freedesktop.impl.portal.Print=umbriel
org.freedesktop.impl.portal.Notification=umbriel
org.freedesktop.impl.portal.Access=umbriel
org.freedesktop.impl.portal.Settings=umbriel
org.freedesktop.impl.portal.Account=umbriel
org.freedesktop.impl.portal.Email=umbriel
org.freedesktop.impl.portal.DynamicLauncher=umbriel
org.freedesktop.impl.portal.Lockdown=umbriel
default=umbriel

# gnome-keyring provides the Secret portal. Its .portal file still says
# UseIn=gnome, but UseIn is deprecated; naming the backend here selects it
# without pulling in the GNOME portal or Mutter.
org.freedesktop.impl.portal.Secret=gnome-keyring

# umbriel's own portal configuration disables Inhibit: the gtk backend's
# inhibitor expects a GNOME session manager. Keep the same behaviour.
org.freedesktop.impl.portal.Inhibit=none